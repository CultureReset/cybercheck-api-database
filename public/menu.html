<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCheck Links</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .menu-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #222;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .menu-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            gap: 15px;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .item-image {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #222;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #d9534f;
            white-space: nowrap;
        }

        .item-description {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .item-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .category-title { font-size: 1.3rem; }

            .menu-item {
                flex-direction: column;
            }

            .item-image {
                width: 100%;
                height: 200px;
            }

            .item-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-price {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CyberCheck Links</h1>
            <p>Browse our menu and offerings</p>
        </div>

        <div id="menu-container">
            <div class="loading">Loading menu...</div>
        </div>
    </div>

    <script>
        // Use GCR API that serves data to both GCR and CyberCheck Links
        const API_BASE = 'https://cybercheck-api-database.vercel.app/api/gcr';
        const SLUG = new URLSearchParams(window.location.search).get('slug') || 'icehouse-tap-room-gulf-shores';

        async function loadMenu() {
            const container = document.getElementById('menu-container');

            try {
                // Call GCR entity endpoint
                const response = await fetch(`${API_BASE}/entity/${encodeURIComponent(SLUG)}`);

                if (!response || !response.ok) {
                    throw new Error('Failed to load menu');
                }

                const { entity } = await response.json();

                if (!entity || !entity.menu) {
                    container.innerHTML = '<div class="empty">Data coming soon</div>';
                    return;
                }

                let html = '';

                // Build menu from sections and items
                const sections = entity.menu.sections || [];
                const items = entity.menu.items || [];

                sections.forEach(sec => {
                    const secItems = items.filter(i => i.section_id === sec.id);
                    if (secItems.length === 0) return;

                    html += `<div class="menu-section"><h3 style="font-size:1.3rem;font-weight:600;margin-bottom:15px;margin-top:20px;color:#222;">${escapeHtml(sec.section_label)}</h3>`;

                    secItems.forEach(item => {
                        const price = item.price_numeric || 0;

                        html += `<div class="menu-item">`;
                        html += `<div class="item-content">`;
                        html += `<div class="item-header">`;
                        html += `<div class="item-name">${escapeHtml(item.item_name)}</div>`;
                        if (price > 0) {
                            html += `<div class="item-price">$${price.toFixed(2)}</div>`;
                        }
                        html += `</div>`;

                        if (item.item_description) {
                            html += `<div class="item-description">${escapeHtml(item.item_description)}</div>`;
                        }

                        html += `</div>`;
                        html += `</div>`;
                    });

                    html += `</div>`;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error('Menu load error:', err);
                container.innerHTML = `<div class="error">Could not load menu. Make sure you're accessing this from the correct domain.</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadMenu();
    </script>
</body>
</html>
